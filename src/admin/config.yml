# Configurazione del pannello (Sveltia CMS)
# DA MODIFICARE: sostituisci TUO-UTENTE/NOME-REPO con il tuo repository GitHub
backend:
  name: github
  repo: scuolabiblicakairos-bit/kairos
  branch: main

locale: it
media_folder: src/assets/uploads
public_folder: /assets/uploads

collections:
  - name: articoli
    label: Articoli
    label_singular: Articolo
    folder: src/blog/posts
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: [date, title]
    fields:
      - { label: Titolo, name: title, widget: string }
      - { label: Data di pubblicazione, name: date, widget: datetime }
      - label: Categoria
        name: categoria
        widget: relation
        collection: categorie
        search_fields: [title]
        value_field: "{{slug}}"
        display_fields: [title]
        required: false
      - { label: Tag, name: tags, widget: list, required: false }
      - { label: Anteprima (poche righe per l'elenco), name: excerpt, widget: text }
      - { label: Testo, name: body, widget: markdown }

  - name: categorie
    label: Categorie
    label_singular: Categoria
    folder: src/categorie
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: Nome, name: title, widget: string }
      - { label: Descrizione, name: description, widget: text, required: false }

  - name: pagine
    label: Pagine
    label_singular: Pagina
    folder: src/pagine
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: Titolo, name: title, widget: string }
      - { label: Sottotitolo, name: sottotitolo, widget: string, required: false }
      - { label: Descrizione per i motori di ricerca, name: description, widget: text, required: false }
      - { label: Testo, name: body, widget: markdown }

  - name: corsi
    label: Corsi
    label_singular: Corso
    folder: src/corsi
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{livello}} · {{title}}"
    fields:
      - { label: Titolo del corso, name: title, widget: string }
      - { label: Livello, name: livello, widget: select, options: [Basic, Intermedio, Avanzato] }
      - { label: Ordine di visualizzazione, name: ordine, widget: number, value_type: int, min: 1 }
      - { label: Stato, name: stato, widget: select, options: [Disponibile, Prossimamente] }
      - { label: Descrizione breve, name: descrizione, widget: text }
      - { label: Numero di lezioni, name: lezioni, widget: number, value_type: int, min: 1 }
      - { label: Moduli (uno per riga), name: moduli, widget: list }
      - { label: Testo del pulsante, name: cta, widget: string, required: false }
      - { label: Presentazione estesa (pagina del corso), name: body, widget: markdown, required: false }

  - name: impostazioni
    label: Impostazioni
    files:
      - name: sito
        label: Menu e impostazioni generali
        file: src/_data/site.json
        format: json
        fields:
          - { label: Nome del sito, name: titolo, widget: string }
          - { label: Autore, name: autore, widget: string }
          - { label: Sottotitolo nella barra, name: sottotitolo, widget: string }
          - { label: Descrizione per i motori di ricerca, name: descrizione, widget: text }
          - label: Menu principale
            name: menu
            widget: list
            summary: "{{fields.etichetta}}"
            fields:
              - { label: Voce, name: etichetta, widget: string }
              - { label: "Indirizzo (es. /corsi/ oppure /#autore)", name: url, widget: string }
              - { label: Mostra come pulsante evidenziato, name: cta, widget: boolean, default: false }
          - label: Menu del footer
            name: menu_footer
            widget: list
            summary: "{{fields.etichetta}}"
            fields:
              - { label: Voce, name: etichetta, widget: string }
              - { label: Indirizzo, name: url, widget: string }
          - { label: Frase nel footer, name: footer_testo, widget: string }
